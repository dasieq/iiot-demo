services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: house-factory-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/house-factory.conf:/mosquitto/config/mosquitto.conf:ro

  modbus-factory:
    build: .
    container_name: house-factory-modbus
    depends_on:
      - mosquitto
    ports:
      - "5020:5020"
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      BASE_TOPIC: uns/v1/house-factory/line-01